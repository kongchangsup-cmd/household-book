<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>가계부</title>
<style>
  :root {
    --bg: #0f0f14;
    --bg2: #18181f;
    --bg3: #22222d;
    --card: #1e1e28;
    --border: #2e2e3a;
    --text: #f0f0f5;
    --text2: #9898a8;
    --text3: #5a5a6e;
    --income: #4ade80;
    --expense: #f87171;
    --accent: #818cf8;
    --accent2: #6366f1;
    --goal: #fbbf24;
    --radius: 16px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    padding-bottom: 90px;
  }

  /* ── 상단 헤더 ── */
  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }

  .app-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .month-nav button {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .month-label {
    font-size: 15px;
    font-weight: 600;
    min-width: 80px;
    text-align: center;
  }

  /* ── 요약 카드 ── */
  .summary-card {
    margin: 16px 16px 0;
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 18px;
  }

  .summary-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 14px;
  }

  .summary-item {
    background: var(--bg3);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
  }

  .summary-label {
    font-size: 11px;
    color: var(--text3);
    margin-bottom: 4px;
    letter-spacing: 0.5px;
  }

  .summary-value {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .summary-value.income { color: var(--income); }
  .summary-value.expense { color: var(--expense); }
  .summary-value.balance { color: var(--accent); }

  /* 목표 바 */
  .goal-section {
    margin-top: 4px;
  }

  .goal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .goal-label {
    font-size: 12px;
    color: var(--text2);
  }

  .goal-remaining {
    font-size: 12px;
    font-weight: 600;
  }

  .goal-remaining.ok { color: var(--income); }
  .goal-remaining.over { color: var(--expense); }

  .progress-bar {
    height: 8px;
    background: var(--bg3);
    border-radius: 4px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    border-radius: 4px;
    transition: width 0.5s ease;
  }

  .progress-fill.ok { background: linear-gradient(90deg, #4ade80, #86efac); }
  .progress-fill.warn { background: linear-gradient(90deg, #fbbf24, #fcd34d); }
  .progress-fill.over { background: linear-gradient(90deg, #f87171, #fca5a5); }

  .goal-set-btn {
    margin-top: 8px;
    font-size: 11px;
    color: var(--text3);
    background: none;
    border: none;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  /* ── 탭 네비 ── */
  .tab-nav {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 16px;
    gap: 4px;
    margin-top: 16px;
    position: sticky;
    top: 89px;
    z-index: 99;
  }

  .tab-btn {
    flex: 1;
    padding: 12px 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--text3);
    background: none;
    border: none;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s, border-color 0.2s;
  }

  .tab-btn.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  /* ── 섹션 공통 ── */
  .section {
    padding: 16px;
  }

  .section-title {
    font-size: 13px;
    color: var(--text3);
    font-weight: 600;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }

  /* ── 거래 목록 ── */
  .tx-list { display: flex; flex-direction: column; gap: 8px; }

  .tx-item {
    background: var(--card);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .tx-icon {
    width: 40px;
    height: 40px;
    background: var(--bg3);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
  }

  .tx-info { flex: 1; min-width: 0; }

  .tx-category {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  .tx-meta {
    font-size: 11px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .tx-right { text-align: right; flex-shrink: 0; }

  .tx-amount {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }

  .tx-amount.income { color: var(--income); }
  .tx-amount.expense { color: var(--expense); }

  .tx-date { font-size: 11px; color: var(--text3); }

  .tx-delete {
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text3);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  /* ── 분석 탭 ── */
  .cat-list { display: flex; flex-direction: column; gap: 10px; }

  .cat-item {
    background: var(--card);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    padding: 12px 14px;
  }

  .cat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }

  .cat-name { font-size: 14px; font-weight: 500; }
  .cat-amount { font-size: 14px; font-weight: 700; color: var(--expense); }

  .cat-bar-bg {
    height: 4px;
    background: var(--bg3);
    border-radius: 2px;
    overflow: hidden;
  }

  .cat-bar-fill {
    height: 100%;
    border-radius: 2px;
    background: var(--accent);
  }

  .cat-pct {
    font-size: 11px;
    color: var(--text3);
    margin-top: 4px;
  }

  /* ── 입력 폼 탭 ── */
  .form-card {
    background: var(--card);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
  }

  .type-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }

  .type-btn {
    padding: 12px;
    border-radius: var(--radius-sm);
    border: 2px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .type-btn.active-income {
    border-color: var(--income);
    background: rgba(74, 222, 128, 0.1);
    color: var(--income);
  }

  .type-btn.active-expense {
    border-color: var(--expense);
    background: rgba(248, 113, 113, 0.1);
    color: var(--expense);
  }

  .form-group { margin-bottom: 16px; }

  .form-label {
    font-size: 12px;
    color: var(--text2);
    font-weight: 500;
    margin-bottom: 6px;
    display: block;
  }

  .form-input, .form-select {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 16px;
    padding: 12px 14px;
    outline: none;
    -webkit-appearance: none;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .form-input:focus, .form-select:focus {
    border-color: var(--accent);
  }

  /* 금액 입력 */
  .amount-wrapper { position: relative; }
  .amount-prefix {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    color: var(--text2);
    font-weight: 600;
  }
  .amount-input {
    padding-left: 28px !important;
    font-size: 22px !important;
    font-weight: 700 !important;
    letter-spacing: -0.5px;
  }

  /* 빠른 금액 버튼 */
  .quick-amounts {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
  }

  .quick-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text2);
    font-size: 12px;
    padding: 6px 10px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .quick-btn:active {
    background: var(--accent2);
    border-color: var(--accent);
    color: white;
  }

  /* 카테고리 그리드 */
  .cat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 6px;
  }

  .cat-pick-btn {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text2);
    font-size: 12px;
    padding: 10px 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.15s;
  }

  .cat-pick-btn.selected {
    border-color: var(--accent);
    background: rgba(129, 140, 248, 0.15);
    color: var(--accent);
  }

  .cat-pick-icon { font-size: 20px; }
  .cat-pick-name { font-size: 11px; }

  /* 제출 버튼 */
  .submit-btn {
    width: 100%;
    padding: 16px;
    border-radius: var(--radius-sm);
    border: none;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 8px;
    transition: opacity 0.2s, transform 0.1s;
    letter-spacing: -0.3px;
  }

  .submit-btn:active { transform: scale(0.98); opacity: 0.9; }
  .submit-btn.income-mode { background: var(--income); color: #052e16; }
  .submit-btn.expense-mode { background: var(--expense); color: #3f0000; }

  /* ── 하단 네비 ── */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: flex;
    padding: 8px 0 20px;
  }

  .nav-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: var(--text3);
    font-size: 10px;
    cursor: pointer;
    padding: 8px 0;
    transition: color 0.2s;
  }

  .nav-btn.active { color: var(--accent); }
  .nav-icon { font-size: 22px; }

  /* 모달 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 200;
    display: flex;
    align-items: flex-end;
    justify-content: center;
  }

  .modal {
    background: var(--bg2);
    border-radius: var(--radius) var(--radius) 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    padding: 24px 20px 40px;
    width: 100%;
    max-width: 430px;
  }

  .modal-title {
    font-size: 17px;
    font-weight: 700;
    margin-bottom: 20px;
    text-align: center;
  }

  /* 로딩/빈 상태 */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--text3);
  }

  .empty-icon { font-size: 40px; margin-bottom: 12px; }
  .empty-text { font-size: 14px; }

  .loading {
    display: flex;
    justify-content: center;
    padding: 40px;
  }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* API URL 설정 */
  .setup-screen {
    padding: 40px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    text-align: center;
  }

  .setup-icon { font-size: 56px; margin-bottom: 20px; }
  .setup-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .setup-desc { font-size: 14px; color: var(--text2); line-height: 1.6; margin-bottom: 32px; }

  .setup-input {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-size: 13px;
    padding: 14px;
    outline: none;
    margin-bottom: 12px;
    font-family: monospace;
  }

  .setup-btn {
    width: 100%;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent2);
    color: white;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
  }

  .hidden { display: none !important; }

  /* toast */
  .toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    z-index: 300;
    opacity: 0;
    transition: opacity 0.3s;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- ══ API 설정 화면 ══════════════════════════════════════════ -->
<div id="setupScreen" class="setup-screen">
  <div class="setup-icon">📒</div>
  <div class="setup-title">가계부 설정</div>
  <div class="setup-desc">
    Google Apps Script를 웹 앱으로 배포한 후<br>
    아래에 URL을 붙여넣어 주세요.
  </div>
  <input id="apiUrlInput" class="setup-input" type="url"
    placeholder="https://script.google.com/macros/s/.../exec">
  <button class="setup-btn" onclick="saveApiUrl()">저장하고 시작</button>
</div>

<!-- ══ 메인 앱 ════════════════════════════════════════════════ -->
<div id="mainApp" class="hidden">

  <!-- 헤더 -->
  <div class="header">
    <div class="header-top">
      <div class="app-title">📒 가계부</div>
      <button onclick="showSettings()" style="background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;">⚙️</button>
    </div>
    <div class="month-nav">
      <button onclick="changeMonth(-1)">‹</button>
      <div class="month-label" id="monthLabel"></div>
      <button onclick="changeMonth(1)">›</button>
    </div>
  </div>

  <!-- 요약 카드 -->
  <div class="summary-card">
    <div class="summary-row">
      <div class="summary-item">
        <div class="summary-label">수입</div>
        <div class="summary-value income" id="totalIncome">-</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">지출</div>
        <div class="summary-value expense" id="totalExpense">-</div>
      </div>
    </div>
    <div class="summary-item" style="margin-bottom:14px;">
      <div class="summary-label">잔액</div>
      <div class="summary-value balance" id="totalBalance">-</div>
    </div>
    <div class="goal-section">
      <div class="goal-header">
        <span class="goal-label" id="goalLabel">목표 미설정</span>
        <span class="goal-remaining" id="goalRemaining"></span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill ok" id="progressFill" style="width:0%"></div>
      </div>
      <button class="goal-set-btn" onclick="openGoalModal()">목표 금액 설정 →</button>
    </div>
  </div>

  <!-- 탭 네비 -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="showTab('list')" id="tab-list">내역</button>
    <button class="tab-btn" onclick="showTab('analysis')" id="tab-analysis">분석</button>
    <button class="tab-btn" onclick="showTab('input')" id="tab-input">입력</button>
  </div>

  <!-- ── 거래 목록 탭 ── -->
  <div id="tabList" class="section">
    <div class="section-title">이번 달 거래</div>
    <div id="txList" class="tx-list"></div>
  </div>

  <!-- ── 분석 탭 ── -->
  <div id="tabAnalysis" class="section hidden">
    <div class="section-title">카테고리별 지출</div>
    <div id="catBreakdown" class="cat-list"></div>
  </div>

  <!-- ── 입력 탭 ── -->
  <div id="tabInput" class="section hidden">
    <div class="form-card">
      <!-- 수입/지출 토글 -->
      <div class="type-toggle">
        <button class="type-btn active-expense" id="btnExpense" onclick="setType('지출')">지출</button>
        <button class="type-btn" id="btnIncome" onclick="setType('수입')">수입</button>
      </div>

      <!-- 날짜 -->
      <div class="form-group">
        <label class="form-label">날짜</label>
        <input type="date" class="form-input" id="inputDate">
      </div>

      <!-- 금액 -->
      <div class="form-group">
        <label class="form-label">금액</label>
        <div class="amount-wrapper">
          <span class="amount-prefix">₩</span>
          <input type="number" class="form-input amount-input" id="inputAmount"
            placeholder="0" inputmode="numeric">
        </div>
        <div class="quick-amounts">
          <button class="quick-btn" onclick="addAmount(10000)">+1만</button>
          <button class="quick-btn" onclick="addAmount(50000)">+5만</button>
          <button class="quick-btn" onclick="addAmount(100000)">+10만</button>
          <button class="quick-btn" onclick="addAmount(500000)">+50만</button>
          <button class="quick-btn" onclick="clearAmount()">지우기</button>
        </div>
      </div>

      <!-- 카테고리 -->
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <div class="cat-grid" id="catGrid"></div>
      </div>

      <!-- 메모 -->
      <div class="form-group">
        <label class="form-label">메모 (선택)</label>
        <input type="text" class="form-input" id="inputMemo" placeholder="어디서 사용했나요?">
      </div>

      <button class="submit-btn expense-mode" id="submitBtn" onclick="submitTransaction()">
        지출 기록
      </button>
    </div>
  </div>

</div>

<!-- 목표 설정 모달 -->
<div id="goalModal" class="modal-overlay hidden" onclick="closeGoalModal(event)">
  <div class="modal">
    <div class="modal-title">이번 달 지출 목표</div>
    <div class="form-group">
      <label class="form-label">목표 금액</label>
      <div class="amount-wrapper">
        <span class="amount-prefix">₩</span>
        <input type="number" class="form-input amount-input" id="goalInput"
          placeholder="0" inputmode="numeric">
      </div>
    </div>
    <button class="submit-btn expense-mode" onclick="saveGoal()" style="background:var(--accent2)">
      목표 저장
    </button>
  </div>
</div>

<!-- 수정 모달 -->
<div id="editModal" class="modal-overlay hidden" onclick="closeEditModal(event)">
  <div class="modal">
    <div class="modal-title">거래내역 수정</div>
    <div class="type-toggle" style="margin-bottom:16px;">
      <button class="type-btn" id="editBtnExpense" onclick="setEditType('지출')">지출</button>
      <button class="type-btn" id="editBtnIncome" onclick="setEditType('수입')">수입</button>
    </div>
    <div class="form-group">
      <label class="form-label">날짜</label>
      <input type="date" class="form-input" id="editDate">
    </div>
    <div class="form-group">
      <label class="form-label">금액</label>
      <div class="amount-wrapper">
        <span class="amount-prefix">₩</span>
        <input type="number" class="form-input amount-input" id="editAmount" placeholder="0" inputmode="numeric">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">카테고리</label>
      <div class="cat-grid" id="editCatGrid"></div>
    </div>
    <div class="form-group">
      <label class="form-label">메모</label>
      <input type="text" class="form-input" id="editMemo" placeholder="메모">
    </div>
    <button class="submit-btn" id="editSubmitBtn" onclick="submitEdit()" style="background:var(--accent2);color:white;">수정 완료</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── 상태 ──────────────────────────────────────────────────────
let API_URL = localStorage.getItem('가계부_apiUrl') || '';
let currentDate = new Date();
let currentYM = '';
let categories = [];
let selectedType = '지출';
let selectedCategory = '';
let summary = null;

// ── 초기화 ───────────────────────────────────────────────────
function init() {
  if (!API_URL) {
    document.getElementById('setupScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
    return;
  }
  document.getElementById('setupScreen').classList.add('hidden');
  document.getElementById('mainApp').classList.remove('hidden');
  updateMonthLabel();
  loadAll();
}

function saveApiUrl() {
  const url = document.getElementById('apiUrlInput').value.trim();
  if (!url.startsWith('https://')) { showToast('올바른 URL을 입력해주세요'); return; }
  API_URL = url;
  localStorage.setItem('가계부_apiUrl', url);
  // 시트 초기화
  fetch(`${API_URL}?action=init`).catch(()=>{});
  init();
}

function showSettings() {
  if (confirm('API URL을 변경하시겠습니까?')) {
    document.getElementById('apiUrlInput').value = API_URL;
    document.getElementById('setupScreen').classList.remove('hidden');
    document.getElementById('mainApp').classList.add('hidden');
  }
}

// ── 월 관리 ──────────────────────────────────────────────────
function updateMonthLabel() {
  const y = currentDate.getFullYear();
  const m = currentDate.getMonth() + 1;
  currentYM = `${y}${String(m).padStart(2, '0')}`;
  document.getElementById('monthLabel').textContent = `${y}년 ${m}월`;
}

function changeMonth(delta) {
  currentDate.setMonth(currentDate.getMonth() + delta);
  updateMonthLabel();
  loadAll();
}

// ── 데이터 로드 ──────────────────────────────────────────────
async function loadAll() {
  await Promise.all([loadSummary(), loadTransactions(), loadCategories()]);
}

async function apiGet(params) {
  const qs = new URLSearchParams(params).toString();
  // Apps Script는 POST로 파라미터를 body에 담아 보내야 리다이렉트 시 유지됨
  // GET 대신 파라미터를 포함한 URL을 직접 호출 (redirect follow)
  const res = await fetch(`${API_URL}?${qs}`, {
    redirect: 'follow',
    method: 'GET',
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { throw new Error('응답 파싱 오류: ' + text.slice(0, 100)); }
}

async function apiPost(body) {
  // Apps Script POST도 파라미터를 queryString으로 전달
  const action = body.action;
  const res = await fetch(`${API_URL}?action=${action}`, {
    method: 'POST',
    redirect: 'follow',
    body: JSON.stringify(body),
  });
  const text = await res.text();
  try { return JSON.parse(text); }
  catch { throw new Error('응답 파싱 오류: ' + text.slice(0, 100)); }
}

async function loadSummary() {
  try {
    const data = await apiGet({ action: 'getSummary', yearMonth: currentYM });
    summary = data;
    renderSummary(data);
  } catch(e) { console.error(e); }
}

async function loadTransactions() {
  const el = document.getElementById('txList');
  el.innerHTML = '<div class="loading"><div class="spinner"></div></div>';
  try {
    const data = await apiGet({ action: 'getTransactions', yearMonth: currentYM });
    window._allTransactions = data.transactions || [];
    renderTransactions(window._allTransactions);
  } catch(e) {
    el.innerHTML = '<div class="empty-state"><div class="empty-text">데이터를 불러올 수 없습니다</div></div>';
  }
}

async function loadCategories() {
  try {
    const data = await apiGet({ action: 'getCategories' });
    categories = data.categories || [];
    renderCatGrid();
  } catch(e) {}
}

// ── 렌더링 ───────────────────────────────────────────────────
function fmt(n) {
  return Number(n).toLocaleString('ko-KR');
}

function renderSummary(s) {
  document.getElementById('totalIncome').textContent = `+${fmt(s.income)}원`;
  document.getElementById('totalExpense').textContent = `-${fmt(s.expense)}원`;
  const bal = s.income - s.expense;
  const balEl = document.getElementById('totalBalance');
  balEl.textContent = `${bal >= 0 ? '+' : ''}${fmt(bal)}원`;
  balEl.style.color = bal >= 0 ? 'var(--income)' : 'var(--expense)';

  const goalEl = document.getElementById('goalLabel');
  const remEl = document.getElementById('goalRemaining');
  const barEl = document.getElementById('progressFill');

  if (s.goal > 0) {
    const pct = Math.min((s.expense / s.goal) * 100, 100);
    const rem = s.goal - s.expense;
    goalEl.textContent = `지출 목표 ${fmt(s.goal)}원`;
    remEl.textContent = rem >= 0 ? `잔여 ${fmt(rem)}원` : `초과 ${fmt(-rem)}원`;
    remEl.className = 'goal-remaining ' + (rem >= 0 ? 'ok' : 'over');
    barEl.style.width = pct + '%';
    barEl.className = 'progress-fill ' + (pct < 70 ? 'ok' : pct < 90 ? 'warn' : 'over');
  } else {
    goalEl.textContent = '목표 미설정';
    remEl.textContent = '';
    barEl.style.width = '0%';
  }
}

function renderTransactions(txs) {
  const el = document.getElementById('txList');
  if (!txs.length) {
    el.innerHTML = `<div class="empty-state">
      <div class="empty-icon">💸</div>
      <div class="empty-text">이번 달 거래 내역이 없어요</div>
    </div>`;
    return;
  }

  const catMap = {};
  categories.forEach(c => { catMap[c.name] = String(c.icon || ''); });

  // 날짜별 그룹
  const groups = {};
  txs.forEach(tx => {
    const d = new Date(tx.date);
    const key = `${d.getMonth()+1}월 ${d.getDate()}일`;
    if (!groups[key]) groups[key] = [];
    groups[key].push(tx);
  });

  let html = '';
  Object.entries(groups).forEach(([date, items]) => {
    html += `<div class="section-title" style="margin-top:8px;margin-bottom:6px;">${date}</div>`;
    items.forEach(tx => {
      const isIncome = tx.type === '수입';
      const icon = catMap[tx.category] || (isIncome ? '💰' : '💸');
      const txJson = JSON.stringify(tx).replace(/'/g, '&#39;');
      html += `
        <div class="tx-item" onclick="openEditModal('${tx.id}')" style="cursor:pointer;">
          <div class="tx-icon">${icon}</div>
          <div class="tx-info">
            <div class="tx-category">${tx.category}</div>
            <div class="tx-meta">${tx.memo || tx.type}</div>
          </div>
          <div class="tx-right">
            <div class="tx-amount ${isIncome ? 'income' : 'expense'}">
              ${isIncome ? '+' : '-'}${fmt(tx.amount)}원
            </div>
            <div class="tx-date" style="font-size:10px;color:var(--text3);margin-top:2px;">✏️ 탭하여 수정</div>
          </div>
          <button class="tx-delete" onclick="event.stopPropagation();deleteItem('${tx.id}')">✕</button>
        </div>`;
    });
  });

  el.innerHTML = html;
}

function renderCatGrid() {
  const grid = document.getElementById('catGrid');
  const filtered = categories.filter(c => c.type === selectedType);
  grid.innerHTML = filtered.map(c => `
    <button class="cat-pick-btn ${selectedCategory === c.name ? 'selected' : ''}"
      onclick="selectCategory('${c.name}')">
      <span class="cat-pick-icon">${c.icon}</span>
      <span class="cat-pick-name">${c.name}</span>
    </button>
  `).join('');

  if (!filtered.find(c => c.name === selectedCategory)) selectedCategory = '';
}

function renderAnalysis() {
  if (!summary) return;
  const el = document.getElementById('catBreakdown');
  const breakdown = summary.categoryBreakdown || [];

  if (!breakdown.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div class="empty-text">지출 내역이 없어요</div></div>`;
    return;
  }

  const max = breakdown[0].amount;
  el.innerHTML = breakdown.map(c => {
    const pct = max > 0 ? Math.round((c.amount / max) * 100) : 0;
    const totalPct = summary.expense > 0 ? Math.round((c.amount / summary.expense) * 100) : 0;
    return `
      <div class="cat-item">
        <div class="cat-row">
          <span class="cat-name">${c.name}</span>
          <span class="cat-amount">${fmt(c.amount)}원</span>
        </div>
        <div class="cat-bar-bg">
          <div class="cat-bar-fill" style="width:${pct}%"></div>
        </div>
        <div class="cat-pct">전체 지출의 ${totalPct}%</div>
      </div>`;
  }).join('');
}

// ── 탭 전환 ──────────────────────────────────────────────────
function showTab(tab) {
  ['list','analysis','input'].forEach(t => {
    document.getElementById('tab-' + t).classList.remove('active');
    document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1)).classList.add('hidden');
  });
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.remove('hidden');
  if (tab === 'analysis') renderAnalysis();
}

// ── 입력 폼 ──────────────────────────────────────────────────
function setType(type) {
  selectedType = type;
  selectedCategory = '';

  document.getElementById('btnExpense').className = 'type-btn' + (type === '지출' ? ' active-expense' : '');
  document.getElementById('btnIncome').className = 'type-btn' + (type === '수입' ? ' active-income' : '');

  const btn = document.getElementById('submitBtn');
  btn.textContent = type + ' 기록';
  btn.className = 'submit-btn ' + (type === '지출' ? 'expense-mode' : 'income-mode');

  renderCatGrid();
}

function selectCategory(name) {
  selectedCategory = name;
  renderCatGrid();
}

function addAmount(n) {
  const el = document.getElementById('inputAmount');
  el.value = (parseInt(el.value || '0') + n);
}

function clearAmount() {
  document.getElementById('inputAmount').value = '';
}

// 오늘 날짜 기본값
function initForm() {
  const today = new Date();
  const y = today.getFullYear();
  const m = String(today.getMonth() + 1).padStart(2, '0');
  const d = String(today.getDate()).padStart(2, '0');
  document.getElementById('inputDate').value = `${y}-${m}-${d}`;
  document.getElementById('inputAmount').value = '';
  document.getElementById('inputMemo').value = '';
  selectedCategory = '';
  renderCatGrid();
}

async function submitTransaction() {
  const date = document.getElementById('inputDate').value;
  const amount = parseInt(document.getElementById('inputAmount').value);
  const memo = document.getElementById('inputMemo').value;

  if (!date) { showToast('날짜를 선택해주세요'); return; }
  if (!amount || amount <= 0) { showToast('금액을 입력해주세요'); return; }
  if (!selectedCategory) { showToast('카테고리를 선택해주세요'); return; }

  const btn = document.getElementById('submitBtn');
  btn.textContent = '저장 중...';
  btn.disabled = true;

  try {
    const result = await apiPost({
      action: 'addTransaction',
      date, type: selectedType, category: selectedCategory,
      amount, memo
    });

    if (result.success) {
      showToast('✅ 기록했습니다!');
      initForm();
      loadAll();
      setTimeout(() => showTab('list'), 500);
    } else {
      showToast('❌ 오류: ' + (result.error || '저장 실패'));
    }
  } catch(e) {
    showToast('❌ 연결 오류');
  }

  btn.textContent = selectedType + ' 기록';
  btn.disabled = false;
}

async function deleteItem(id) {
  if (!confirm('삭제하시겠습니까?')) return;
  try {
    const result = await apiPost({ action: 'deleteTransaction', id });
    if (result.success) {
      showToast('삭제되었습니다');
      loadAll();
    }
  } catch(e) { showToast('삭제 실패'); }
}

// ── 수정 모달 ────────────────────────────────────────────────
let editingTx = null;
let editSelectedType = '지출';
let editSelectedCategory = '';

function openEditModal(id) {
  // 현재 로드된 거래내역에서 찾기
  const allTx = window._allTransactions || [];
  const tx = allTx.find(t => t.id === id);
  if (!tx) { showToast('항목을 찾을 수 없습니다'); return; }

  editingTx = tx;
  editSelectedType = tx.type;
  editSelectedCategory = tx.category;

  document.getElementById('editDate').value = tx.date;
  document.getElementById('editAmount').value = tx.amount;
  document.getElementById('editMemo').value = tx.memo || '';

  // 타입 버튼
  setEditType(tx.type);

  document.getElementById('editModal').classList.remove('hidden');
}

function closeEditModal(e) {
  if (e.target.id === 'editModal') {
    document.getElementById('editModal').classList.add('hidden');
  }
}

function setEditType(type) {
  editSelectedType = type;
  editSelectedCategory = '';
  document.getElementById('editBtnExpense').className = 'type-btn' + (type === '지출' ? ' active-expense' : '');
  document.getElementById('editBtnIncome').className = 'type-btn' + (type === '수입' ? ' active-income' : '');
  renderEditCatGrid();
}

function renderEditCatGrid() {
  const grid = document.getElementById('editCatGrid');
  const filtered = categories.filter(c => c.type === editSelectedType);
  grid.innerHTML = filtered.map(c => `
    <button class="cat-pick-btn ${editSelectedCategory === c.name ? 'selected' : ''}"
      onclick="editSelectCategory('${c.name}')">
      <span class="cat-pick-icon">${String(c.icon || '')}</span>
      <span class="cat-pick-name">${c.name}</span>
    </button>
  `).join('');
}

function editSelectCategory(name) {
  editSelectedCategory = name;
  renderEditCatGrid();
}

async function submitEdit() {
  const date = document.getElementById('editDate').value;
  const amount = parseInt(document.getElementById('editAmount').value);
  const memo = document.getElementById('editMemo').value;

  if (!date) { showToast('날짜를 선택해주세요'); return; }
  if (!amount || amount <= 0) { showToast('금액을 입력해주세요'); return; }
  if (!editSelectedCategory) { showToast('카테고리를 선택해주세요'); return; }

  const btn = document.getElementById('editSubmitBtn');
  btn.textContent = '저장 중...';
  btn.disabled = true;

  try {
    const result = await apiPost({
      action: 'updateTransaction',
      id: editingTx.id,
      date, type: editSelectedType,
      category: editSelectedCategory,
      amount, memo
    });

    if (result.success) {
      showToast('✅ 수정했습니다!');
      document.getElementById('editModal').classList.add('hidden');
      loadAll();
    } else {
      showToast('❌ 오류: ' + (result.error || '수정 실패'));
    }
  } catch(e) {
    showToast('❌ 연결 오류');
  }

  btn.textContent = '수정 완료';
  btn.disabled = false;
}

// ── 목표 설정 ────────────────────────────────────────────────
function openGoalModal() {
  document.getElementById('goalModal').classList.remove('hidden');
  if (summary && summary.goal) {
    document.getElementById('goalInput').value = summary.goal;
  }
}

function closeGoalModal(e) {
  if (e.target.id === 'goalModal') {
    document.getElementById('goalModal').classList.add('hidden');
  }
}

async function saveGoal() {
  const amount = parseInt(document.getElementById('goalInput').value);
  if (!amount || amount <= 0) { showToast('목표 금액을 입력해주세요'); return; }

  try {
    const result = await apiPost({ action: 'setGoal', yearMonth: currentYM, amount });
    if (result.success) {
      showToast('✅ 목표 저장!');
      document.getElementById('goalModal').classList.add('hidden');
      loadSummary();
    }
  } catch(e) { showToast('저장 실패'); }
}

// ── Toast ─────────────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

// ── 시작 ─────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  init();
  initForm();
});
</script>
</body>
</html>
